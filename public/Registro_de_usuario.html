<!DOCTYPE html>
<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brocash - Registro</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!-- Encabezado con Logo y Nombre de la App -->
    <header class="header">
        <div class="encabezado">
            <img src="Logos/Logo.png" class="logo" alt="Logo Brocash"> 
            <h1>Brocash</h1>
        </div>
    </header>   
    
    <!-- Tarjeta centrada estilo Login -->
    <div class="container">
        <h2>Registro de usuario</h2>
        <p>Complete los siguientes campos:</p>

        <form action="/registrar" method="POST">

            <div class="input-group">
                <input type="text" id="Nombre" name="Nombre" required placeholder="Nombre y apellidos">
            </div>
            
            <div class="input-group">
                <input type="number" id="Cedula" name="Cedula" required placeholder="Cédula">
            </div>
            
            <div class="input-group">
                <input type="email" id="email" name="email" required placeholder="Correo electrónico">
            </div>
            
            <div class="input-group">
                <input type="text" id="telefono" name="telefono" required placeholder="Teléfono">
            </div>
            
            <div class="input-group">
                <input type="text" id="ocupacion" name="ocupacion" required placeholder="Ocupación">
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" required placeholder="Digita tu contraseña">
            </div>

            <div class="input-group">
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repite tu contraseña">
            </div>

            <button type="submit">Registrarme</button>
            
            <div class="links">
                <a href="Pagina_Principal.html">Página Principal</a>
            </div>
        </form>
    </div>

</body>
</html>
