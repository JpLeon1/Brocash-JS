<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brocash - Realizar Pago</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <!-- Encabezado con Logo Oficial y Navegación Brocash -->
    <header class="header">
        <div class="encabezado" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="Logos/Logo.png" class="logo" style="width: 40px;">
                <h1 style="margin: 0;">Brocash</h1>
            </div>
            
            <!-- Botones de navegación -->
            <nav class="nav-links" style="display: flex; gap: 15px; align-items: center;">
                <a href="Pagina_Principal.html" style="text-decoration: none; font-weight: bold; color: #2c3e50;">Inicio</a>
                <a href="Solicitud_de_credito.html" style="text-decoration: none; font-weight: bold; color: #2c3e50;">Solicitar Crédito</a>
                <button onclick="cerrarSesion()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Cerrar Sesión</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-card card-pago">
            <h2>Abonar a mi Crédito</h2>
            <p class="subtitulo-pago">Ingresa tu número de radicado para consultar tu saldo y realizar un abono en línea.</p>

            <!-- 1. BÚSQUEDA DE CRÉDITO -->
            <div class="form-group-pago">
                <label for="idCredito">Número de Crédito (ID Radicado):</label>
                <div class="input-grupo-busqueda">
                    <input type="number" id="idCredito" placeholder="Ej: 20261406" required>
                    <button type="button" class="btn-crud btn-aprobar" onclick="consultarCredito()">Consultar</button>
                </div>
            </div>

            <!-- 2. RESUMEN DEL CRÉDITO (Oculto por defecto con CSS) -->
            <div id="seccionResumen" class="info-credito-login hidden">
                <h3 class="titulo-resumen">Resumen del Crédito</h3>
                <p><strong>Cliente:</strong> <span id="lblCliente">-</span></p>
                <p><strong>Monto Total Aprobado:</strong> $<span id="lblMontoOriginal">0</span></p>
                <p><strong>Estado:</strong> <span id="lblEstado" class="badge-login">-</span></p>
            </div>

            <!-- 3. FORMULARIO DE REGISTRO DE PAGO (Oculto por defecto) -->
            <form id="formPago" class="hidden" onsubmit="procesarPago(event)">
                <div class="form-group-pago">
                    <label for="montoAbono">Monto a Abonar ($):</label>
                    <input type="number" id="montoAbono" min="1000" step="100" placeholder="Ej: 50000" required>
                </div>

                <div class="form-group-pago">
                    <label for="metodoPago">Método de Pago:</label>
                    <select id="metodoPago" required>
                        <option value="" disabled selected>-- Selecciona un método --</option>
                        <option value="PSE / Débito Bancario">PSE / Débito Bancario</option>
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                        <option value="Transferencia Débito Brocash">Saldo en Cuenta Brocash</option>
                    </select>
                </div>

                <button type="submit">💳 Confirmar y Pagar</button>
            </form>
        </div>
    </div>

    <script>
        // 🔄 DETECTA AUTOMÁTICAMENTE EL ID PASADO DESDE EL LOGIN POR LA URL
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idCreditoUrl = urlParams.get('id');

            if (idCreditoUrl) {
                document.getElementById('idCredito').value = idCreditoUrl;
                consultarCredito(); // Dispara la consulta automáticamente sin obligar al usuario a hacer clic
            }
        });

        function consultarCredito() {
            const idCredito = document.getElementById('idCredito').value;

            if (!idCredito) {
                alert("Por favor ingresa un número de crédito válido.");
                return;
            }

            fetch(`/estado-credito-id/${idCredito}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.ok) {
                        alert(data.mensaje || "No se encontró el crédito indicado.");
                        document.getElementById('seccionResumen').classList.add('hidden');
                        document.getElementById('formPago').classList.add('hidden');
                        return;
                    }

                    // Llenar datos de la tarjeta de resumen
                    document.getElementById('lblCliente').textContent = data.cliente || 'Usuario Brocash';
                    document.getElementById('lblMontoOriginal').textContent = Number(data.montoSolicitado).toLocaleString('es-CO');
                    
                    const elEstado = document.getElementById('lblEstado');
                    elEstado.textContent = data.estado;
                    elEstado.className = `badge-login ${data.estado}`;

                    // Evaluar el Estado del Crédito para controlar el formulario de pago
                    const estadoLower = String(data.estado).toLowerCase();

                    if (estadoLower === 'aprobado') {
                        document.getElementById('formPago').classList.remove('hidden');
                    } else {
                        document.getElementById('formPago').classList.add('hidden');

                        if (estadoLower === 'pendiente') {
                            alert(`👋 Tu solicitud de crédito N° ${idCredito} está actualmente EN ESTUDIO por nuestros analistas.`);
                        }
                    }

                    document.getElementById('seccionResumen').classList.remove('hidden');
                })
                .catch(err => {
                    console.error("Error al consultar crédito:", err);
                    alert("Ocurrió un error al consultar el número de crédito.");
                });
        }

        function procesarPago(event) {
            event.preventDefault();

            const idCredito = document.getElementById('idCredito').value;
            const monto = document.getElementById('montoAbono').value;
            const metodo = document.getElementById('metodoPago').value;

            if (confirm(`¿Confirmas el abono de $${Number(monto).toLocaleString('es-CO')} mediante ${metodo}?`)) {
                fetch('/registrar-pago', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idCredito: Number(idCredito),
                        monto: Number(monto),
                        metodo: metodo
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        alert(`🎉 ¡Pago N° ${data.idPago} registrado exitosamente!\nSe ha enviado un comprobante a tu correo electrónico.`);
                        location.reload();
                    } else {
                        alert("❌ Error al procesar el pago: " + data.mensaje);
                    }
                })
                .catch(err => {
                    console.error("Error al registrar el pago:", err);
                    alert("Ocurrió un error al conectar con el servidor de pagos.");
                });
            }
        }

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.href = "Pagina_Principal.html";
        }
    </script>
</body>
</html>
