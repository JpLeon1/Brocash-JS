<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Brocash</title>
    <!-- Vincula tus estilos globales reales -->
    <link rel="stylesheet" href="Style.css"> 
</head>
<body>
    <div class="main-container form-container" style="max-width: 500px; margin: 50px auto; padding: 20px; font-family: Arial, sans-serif;">
        
        <!-- SECCIÓN DEL LOGO DE BROCASH (Corregido a tu carpeta real 'Logos') -->
        <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
            <img src="Logos/logo.png" alt="Logo Brocash" style="max-width: 180px; height: auto;">
    <!-- SCRIPT INDISPENSABLE PARA CONECTAR EL BOTÓN AL SERVIDOR -->
    <script>
        document.getElementById('form-actualizar-perfil').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            // Recolectamos las variables exactas que espera el controlador
            const datos = {
                Nombre: document.getElementById('Nombre').value,
                Apellido: document.getElementById('Apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value
            };

            try {
                // Disparamos la petición a la ruta que configuramos en server.js
                const respuesta = await fetch('/ActualizarPerfilServlet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert(resultado.mensaje || '¡Perfil actualizado con éxito!');
                } else {
                    alert('Error: ' + (resultado.error || 'No se pudo actualizar'));
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Ocurrió un error al intentar comunicar con el servidor.');
            }
        });
    </script>
</body>
</html>
