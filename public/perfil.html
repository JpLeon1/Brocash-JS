<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Brocash</title>
    <link rel="stylesheet" href="Style.css"> 
</head>
<body>
    <!-- Forzamos un contenedor visible con fondo blanco para que resalte sobre tu fondo fluido -->
    <div style="max-width: 450px; margin: 40px auto; padding: 30px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; position: relative; z-index: 10;">
        
        <!-- SECCIÓN DEL LOGO -->
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="Logos/logo.png" alt="Logo Brocash" style="max-width: 160px; height: auto;">
        </div>

        <h2 style="text-align: center; color: #333333; margin-bottom: 20px; font-size: 24px; font-weight: 600;">Actualizar Mis Datos</h2>
        
        <form id="form-actualizar-perfil">
            <div style="margin-bottom: 15px;">
                <label for="Nombre" style="display:block; margin-bottom:6px; font-weight: 600; color: #555;">Nombre:</label>
                <input type="text" id="Nombre" name="Nombre" required style="width:100%; padding:10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="Apellido" style="display:block; margin-bottom:6px; font-weight: 600; color: #555;">Apellido:</label>
                <input type="text" id="Apellido" name="Apellido" required style="width:100%; padding:10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="email" style="display:block; margin-bottom:6px; font-weight: 600; color: #555;">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required style="width:100%; padding:10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="telefono" style="display:block; margin-bottom:6px; font-weight: 600; color: #555;">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" style="width:100%; padding:10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box;">
            </div>

            <!-- Botón verde forzado -->
            <button type="submit" style="background-color: #2c8c4d !important; color: white !important; border: none; padding: 12px 15px; cursor: pointer; width: 100%; font-size: 16px; border-radius: 6px; font-weight: bold; transition: background 0.3s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                Guardar Cambios
            </button>
        </form>
    </div>

    <script>
        document.getElementById('form-actualizar-perfil').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                Nombre: document.getElementById('Nombre').value,
                Apellido: document.getElementById('Apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value
            };

            try {
                const respuesta = await fetch('/ActualizarPerfilServlet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    alert(resultado.mensaje || '¡Perfil actualizado con éxito!');
                } else {
                    alert('Error: ' + (resultado.error || 'No se pudo actualizar'));
                }
            } catch (error) {
                console.error('Error de conexión:', error);
                alert('Ocurrió un error al intentar comunicar con el servidor.');
            }
        });
    </script>
</body>
</html>
